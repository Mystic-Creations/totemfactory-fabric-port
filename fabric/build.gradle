plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

fabricApi {
    configureDataGeneration()
}

loom {
    runs {
        datagen {
            server()
            vmArg("-Dfabric-api.datagen")
            vmArg("-Dfabric-api.datagen.output-dir=${file("src/main/generated")}")
            vmArg("-Dfabric-api.datagen.modid=totemfactory")
            vmArg("-Dporting_lib.datagen.existing_resources=${file("src/main/resources")}")
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    //Dependencies
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "com.tterrag.registrate_fabric:Registrate:$rootProject.registrate_refabricated"
    modImplementation "com.simibubi.create:create-fabric:$rootProject.create_fabric" // have the mod in your mods folder instead - Arch Loom isn't remapping correctly
    modImplementation "net.createmod.ponder:Ponder-Fabric-1.20.1:$rootProject.ponder"
    modImplementation "dev.engine-room.flywheel:flywheel-fabric-1.20.1:$rootProject.flywheel"

    //Mods for testing
    modRuntimeOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    modRuntimeOnly "mezz.jei:jei-1.20.1-fabric:${rootProject.jei_version}"

    //Architectury
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'mod_version', project.mod_version

    filesMatching('fabric.mod.json') {
        expand mod_version: inputs.properties.mod_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
