architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Note: Be careful to not use any Fabric-only code from here!
    modImplementation("com.tterrag.registrate_fabric:Registrate-Fabric:$rootProject.registrate_refabricated") {
        exclude group: "net.fabricmc.fabric-api"
    }
    //modImplementation("com.simibubi.create:create-fabric:$rootProject.create_fabric") {
    modImplementation("net.createmod.ponder:Ponder-Common-1.21.1:$rootProject.ponder")
    modImplementation("com.simibubi.create:create-fucked-up-1.21.1:$rootProject.create_fabric")  {
        exclude(group: "com.tterrag.registrate_fabric")
        // stop trying to import the local one that shouldn't even be used
    }
    modCompileOnly(fabricApi.module("fabric-recipe-api-v1", rootProject.fabric_api_version)) // Only for the sake of compiling - not to be used for anything else!

    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
}
